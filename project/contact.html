<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us at Nabzo Electrical and Electronics Company Limited</title>
    <meta name="description" content="Nabzo Rafting Contact information and contact form">
    <meta name="author" content="Nabende Andrew Mafabi">
    <link rel="stylesheet" href="styles/siteplan.css">
    <script src="scripts/siteplan.js" defer></script>
</head>

<body>
    <header>
        <figure>
            <img src="images/nabzom.webp" alt="oscilloscope logo" width="100">
        </figure>
        <nav>
            <ul>
                <li><a href="siteplan.html">Home</a></li>
                <li><a href="products.html">Products & Services</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact">
            <div class="contact information">
                <h1>Contact Information👉</h1>
                <div>
                    <h2>Send us a message on:-</h2>
                    <address>
                        <p>P.O BOX 8989 Kampala.</p>
                        <p>Phone Number:- +256771652048</p>
                        <p>Email:<a href="nmafabi@byupathway.edu">Nabzo Electrical and Electronics Email</a>
                    </address>
                </div>
                <img src="images/three-pharse-induction-motor.jfif" alt="sipi falls" width="400">
            </div>
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3989.7596362424324!2d32.60722058116528!3d0.3107576505305503!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x177dbc7362538d37%3A0x52875ea6886b0682!2sNamuwongo%2C%20Kampala!5e0!3m2!1sen!2sug!4v1774325510038!5m2!1sen!2sug"
                    width="350" height="350" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <div class="form">
                <form method="get" action="nabzo.html" class="wf1">
                    <fieldset>
                        <div>
                            <label>NAME:<input type="text" id="name" name="name" required></label>
                        </div>
                        <div>
                            <label>Email:<input type="email" id="email" name="email"></label>
                        </div>
                        <div>
                            <p><u><b>General inquiry:-</b></u></p>
                            <label><input type="radio" id="General" name="radio">General Inquiry</label>
                        </div>
                        <div>
                            <label><input type="radio" id="reservations" name="radio">Reservation Questions</label>
                        </div>
                        <div>
                            <label><input type="radio" id="website" name="radio">Website Suggestion</label>
                        </div>
                        <div>
                            <label>Message Purpose:<textarea id="textarea" name="textarea" rows="4" wrap="soft"
                                    placeholder="feedback">Message</textarea></label>
                        </div>
                        <div>
                            <label>Please subscribe me to the monthly <input type="checkbox" id="subscribe"
                                    name="subscribe"></label>
                        </div>
                    </fieldset>
                    <button type="submit">SEND!</button>
                </form>

            </div>
        </div>


        <div class="hero">
            <section class="service">
                <h2>"What are here to serve you"</h2>
                <figure class="ceo">
                    <img src="images/Andrew.jpg" alt="Nabzo Electrical and Electronics">
                    <figcaption>C.E.O- Andrew</figcaption>

                </figure>
                <figure class="director">
                    <img src="images/director.webp" alt="Nabzo Electrical and Electronics">
                    <figcaption>DIRECTOR </figcaption>
                </figure>
                <figure class="assdirector">
                    <img src="images/assistant-director.webp" alt="Nabzo Electrical and Electronics">
                    <figcaption>ASS-DIRECTOR </figcaption>
                </figure>
            </section>
        </div>
    </main>
    <footer>
        <p>
            <span id="year"></span>🌴- Nabende Andrew Mafabi 🌴 Kampala, Uganda.
        </p>
        <p><span id="lastmodified"></span> </p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook-f_logo-blue-logo.wine.svg" alt="Facebook Icon"></a>
            <a href="https://linkedIn.com"><img src="images/linkedln-icon-logo.wine.svg" alt="LinkedIn Icon"></a>
            <a href="https://Instagram.com"><img src="images/instagram-logo.ine.svg" alt="Instagram Icon"></a>
        </nav>
    </footer>

</body>

</html>
